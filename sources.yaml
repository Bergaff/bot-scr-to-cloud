# Источники для monitor.py
#
# profile:
#   chat — группа/чат с объявлениями (базовые правила: ищем «везу / нужно передать / кто едет / есть места»)
#   news — новостной канал: посты про очереди, рейсы, правила въезда отсекаются целиком
#          ВНИМАНИЕ: в чатах с объявлениями профиль news вреден — он гасит посты со словами
#          «без очереди», «очередь», «рейс», «автобус», а это частые фразы водителей.
#          Ставь news только если источник — чисто новостной канал.
#
# min_score — порог совпадения (по умолчанию 5). Меньше — больше находок и больше шума.
# catchup   — сколько последних сообщений прочитать при старте (0 — не читать историю).
#             Большое значение нужно только при первом запуске: дальше всё берётся по таблице seen.
#
# Аккаунты. Два аккаунта читают РАЗНЫЕ чаты: у каждого свой список ниже (account: main /
# account: second). Файлы сессий: monitor_session.session и second_session.session.
# Ключи приложения (TG_API_ID/TG_API_HASH) у них общие — это ключи приложения, а не аккаунта.
#
# Проверить, что всё читается и куда надо вступить:
#   в облаке  — GET /sources-check (контейнер сам подключится к обоим аккаунтам)
#   локально  — start.bat --check-sources, но ТОЛЬКО при остановленном облаке:
#               второй клиент на тот же .session отзывает ключ (AuthKeyDuplicatedError).

defaults:
  profile: chat
  min_score: 5
  catchup: 50
  heartbeat: 0             # живой режим: печатать пульс раз в N минут (0 — молча; удобно 15)
  skip_hidden: true        # не брать объявления от авторов со скрытым профилем («hidden by user»):
                           # у них не открывается профиль, написать такому человеку нельзя.
                           # Оставить такие сообщения: skip_hidden: false или флаг --keep-hidden
  order: random            # порядок обхода чатов: random — каждый запуск со случайного чата
                           # (чтобы при дневном лимите пересылок не голодали чаты в конце списка);
                           # config — строго в том порядке, как ниже

# Кто читает: имена отсюда совпадают с account: у источников и с именами файлов сессий.
accounts:
  main:
    session: monitor_session      # monitor_session.session
    forward:
      to: "@parcel_transfer_bot"
      max_per_day: 180            # лимит на этот аккаунт (общий — ниже, он же по умолчанию)
  second:
    session: second_session       # second_session.session
    forward:
      to: "@parcel_transfer_bot"
      max_per_day: 120            # второй аккаунт моложе — лимит держим ниже

# Пересылка найденных сообщений (именно forward, не копия) твоим аккаунтом.
# Получатель — твой бот @parcel_transfer_bot: открой с этого же аккаунта чат с ботом
# и нажми Start, иначе отправить не получится.
forward:
  to: "@parcel_transfer_bot"
  mode: forward            # forward — честная пересылка; copy — текст со ссылкой
  max_per_day: 180         # лимит отправок в сутки (0 — без ограничения). Выше 200 не советую:
                           # поток с 10 чатов в вечерний пик даёт 8-12 находок в час
  fallback: link           # если в чате запрещена пересылка: link (текст+ссылка) или skip
  # Сутки считаются с местной полуночи (не по UTC). Что не влезло в лимит — не теряется:
  # находка встаёт в очередь и уходит в следующий прогон, как только лимит обнулится.

sources:
  # ═══ Аккаунт main (monitor_session): посылки / передачи / попутчики / граница ═══

  # ─── Чаты объявлений: посылки / передачи / попутчики ─────────────────────────
  - target: "@travelersminsk"
    title: "Посылки 📦 Доставки 🧳 Попутчики 🙋 Водители 🚘"
    account: main
    profile: chat
    min_score: 4
    catchup: 50

  - target: "@belgranica"
    title: "Граница (чат)"
    account: main
    profile: chat
    min_score: 5
    catchup: 50

  # ─── Приватный чат по ссылке-приглашению (приоритетный источник) ────────────
  # Подписка: аккаунт должен быть в чате. Если ещё не вступил — запусти с --auto-join,
  # тогда радар подпишется по этой ссылке сам. Ключ в статистике: +CmQyl50rf-NlODFi
  # Проверка: /sources-check покажет «НУЖНО ВСТУПИТЬ», если main в чате нет.
  - target: "https://t.me/+CmQyl50rf-NlODFi"
    title: "Приватный чат (приоритетный)"
    account: main
    profile: chat
    min_score: 4
    catchup: 100          # источник назван важным — читаем глубокий хвост

  # ─── Остальные чаты по границе ──────────────────────────────────────────────
